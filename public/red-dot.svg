<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      @keyframes pingEffect {
        0% {
          r: 5px;
          opacity: 0.85;
        }
        70% {
          r: 13px;
          opacity: 0.2;
        }
        100% {
          r: 15px;
          opacity: 0;
        }
      }
      @keyframes blinkEffect {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.35;
          transform: scale(0.85);
        }
      }
      .ring {
        transform-origin: 16px 16px;
        animation: pingEffect 1.2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .dot {
        transform-origin: 16px 16px;
        animation: blinkEffect 1.2s ease-in-out infinite;
      }
    </style>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5252" stop-opacity="1"/>
      <stop offset="65%" stop-color="#B23A2E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7B1D14" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <!-- Outer Pulse / Ping Wave -->
  <circle class="ring" cx="16" cy="16" r="6" fill="#B23A2E">
    <animate attributeName="r" values="5;13;15" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;0.2;0" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Ambient Glow Aura -->
  <circle cx="16" cy="16" r="9" fill="#B23A2E" opacity="0.35">
    <animate attributeName="opacity" values="0.45;0.15;0.45" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Main Red Dot Body -->
  <circle class="dot" cx="16" cy="16" r="5.5" fill="url(#redGlow)">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Glossy Specular Center Core -->
  <circle class="dot" cx="14.8" cy="14.8" r="1.8" fill="#FFFFFF" opacity="0.85">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
